# BONNE ASSISE — Render Blueprint
# Two native services (no Docker). Frontend = Next.js, Backend = FastAPI.

services:
  - type: web
    name: bonne-assise-api
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: bonne-assise-web
    runtime: node
    plan: free
    rootDir: Frontend
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /en
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
